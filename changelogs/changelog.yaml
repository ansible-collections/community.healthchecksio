ancestor: null
releases:
  0.1.0:
    modules:
    - description: Get the project badges
      name: badges_info
      namespace: ''
    - description: Get a list of integrations
      name: channels_info
      namespace: ''
    - description: Create, delete, update, and pause checks
      name: checks
      namespace: ''
    - description: Get a list of check flips
      name: checks_flips_info
      namespace: ''
    - description: Get a list of checks
      name: checks_info
      namespace: ''
    - description: Get a list of check pings
      name: checks_pings_info
      namespace: ''
    - description: Signal success, fail, and start events
      name: ping
      namespace: ''
    release_date: '2021-10-24'
  0.1.1:
    changes:
      release_summary: Updating the README.md and switching the integration tests
        to GHAs (https://github.com/ansible-collections/community.healthchecksio/pull/9).
    fragments:
    - 0.1.1.yaml
    release_date: '2021-10-27'
  1.1.1:
    changes:
      breaking_changes:
      - checks - support creating Simple checks. Previously, C(schedule) and C(tz)
        were defaulted which made it impossible to differentiate between Simple and
        Cron checks when creating them. Now, either C(schedule) and C(tz) must be
        provided to create a Cron check, or, C(timeout) must be provided to create
        a Simple check (https://github.com/ansible-collections/community.healthchecksio/issues/16).
      bugfixes:
      - Update the tests so that they only run once (https://github.com/ansible-collections/community.healthchecksio/issues/11).
      - ping - remove C(default="") on required C(uuid) parameter (https://github.com/ansible-collections/community.healthchecksio/issues/19).
      release_summary: Adding support for Simple checks.
    fragments:
    - 11-tests-running-twice.yaml
    - 16-create-simple-checks.yaml
    - 19-remove-default-uuid.yaml
    release_date: '2022-04-06'
  1.2.0:
    changes:
      bugfixes:
      - checks - restore C(grace) parameter to Cron checks (https://github.com/ansible-collections/community.healthchecksio/issues/24).
      minor_changes:
      - ci - adding stable-2.13 to sanity and unit testing (https://github.com/ansible-collections/community.healthchecksio/issues/22).
      release_summary: Restoring the C(grace) parameter to Cron checks and adding
        Ansible 2.13 to sanity and unit testing.
    fragments:
    - 22-ci-sanity-2.13.yaml
    - 24-grace.yaml
    release_date: '2022-05-19'
  1.3.0:
    changes:
      minor_changes:
      - checks - implement idempotency when unique param is used (https://github.com/ansible-collections/community.healthchecksio/issues/28)
      release_summary: Implement idempotency when unique param is used in checks.
    fragments:
    - 29-idempotency.yaml
    release_date: '2023-03-10'
  1.3.1:
    changes:
      bugfixes:
      - checks - channel comparison result was order dependent. Fix now compares channels
        lists as sets (https://github.com/ansible-collections/community.healthchecksio/pull/35).
    fragments:
    - 120-compare-channel-sets-as-equal.yaml
    release_date: '2023-08-03'
  1.3.2:
    changes:
      bugfixes:
      - Replace deprecated ``ansible.module_utils._text`` import with ``ansible.module_utils.common.text.converters``
        (https://github.com/ansible-collections/community.healthchecksio/pull/46).
    release_date: '2026-04-18'
  1.4.0:
    changes:
      minor_changes:
      - healthchecksio.checks - Add ``management_api_token`` (with ``api_key`` alias)
        and ``ping_api_token`` for separate management/ping token support.
      - healthchecksio.checks - Add diff_mode support (returns ``before``/``after``
        state on create/update).
      - healthchecksio.checks - Add support for self-hosted Healthchecks.io instances
        via ``management_api_base_url`` and ``ping_api_base_url`` parameters.
      - healthchecksio.checks - Fix idempotency comparison to include the ``tags``
        field.
      - healthchecksio.checks - Proper check_mode support (delete/pause report would-be
        changes instead of silently exiting early).
    release_date: '2026-04-18'
  1.5.0:
    changes:
      bugfixes:
      - checks - Declare ``supports_diff_mode`` in a form compatible with Ansible
        2.9.
      - checks - Fix idempotency when comparing ``grace`` for Cron checks if the API
        omits or returns ``null`` for ``grace`` while the module applies a default.
      - plugins/module_utils - Add legacy metaclass boilerplate for current ``ansible-test
        sanity`` expectations.
      minor_changes:
      - checks_info - Add optional ``name`` filter when listing checks; values sent
        to the API are URL-encoded.
    release_date: '2026-04-19'
  1.5.1:
    changes:
      bugfixes:
      - badges_info, channels_info, checks_flips_info, checks_info, and checks_pings_info
        perform read-only GET requests in check mode instead of returning empty data
        (https://github.com/ansible-collections/community.healthchecksio/issues/34).
    fragments:
    - 34-info-get-check-mode.yml
    release_date: '2026-04-20'
  1.5.2:
    changes:
      bugfixes:
      - Use ``request_timeout`` for HTTP client timeouts instead of overloading ``timeout``,
        which the checks module uses for check period (https://github.com/ansible-collections/community.healthchecksio/issues/54).
      minor_changes:
      - Add ``validate_certs`` parameter to all modules for self-hosted instances
        with private CAs (https://github.com/ansible-collections/community.healthchecksio/issues/54).
    fragments:
    - 54-validate-certs-request-timeout.yaml
    release_date: '2026-07-16'
  1.5.3:
    changes:
      minor_changes:
      - ping - add ``runid`` parameter support for Healthchecks.io run ID tracking
        (https://github.com/ansible-collections/community.healthchecksio/issues/58).
    fragments:
    - 58-ping-runid.yml
    release_date: '2026-07-31'
  1.5.4:
    changes:
      bugfixes:
      - Handle invalid API error-response JSON on legacy Python versions without referencing
        the unavailable JSONDecodeError exception.
    fragments:
    - 62-legacy-json-error.yml
    release_date: '2026-08-01'
  2.0.0:
    changes:
      breaking_changes:
      - The default management API base URL now targets Healthchecks.io API v3 instead
        of v1.
      - checks - when both schedule and timeout are supplied, schedule now takes precedence;
        tz now requires schedule.
      - checks_flips_info - uuid or unique_key is now required to identify the check.
      - checks_pings_info - uuid is now required to identify the check.
      bugfixes:
      - API request payloads no longer include collection connection settings, and
        omitted check fields are no longer overwritten during explicit updates.
      major_changes:
      - The collection now defaults to Healthchecks.io Management API v3 and provides
        documented endpoint parity.
      minor_changes:
      - checks - add explicit UUID updates, resume state, and all documented v3 keyword
        filtering fields.
      - checks_flips_info - add read-only unique-key lookup and time filters.
      - checks_info - add slug filtering and read-only unique-key lookup.
      - checks_ping_body_info - add retrieval of stored ping request bodies.
      - ping - add slug addressing, log events, diagnostic bodies, exit statuses,
        HTTP method selection, and automatic slug check creation.
      - status_info - add the database connectivity status endpoint.
    fragments:
    - api-v3-parity.yml
    modules:
    - description: Get a logged ping body
      name: checks_ping_body_info
      namespace: ''
    - description: Check Healthchecks.io service status
      name: status_info
      namespace: ''
    release_date: '2026-08-02'
